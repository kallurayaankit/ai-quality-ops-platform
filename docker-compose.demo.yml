services:
  mock-ai:
    build:
      context: ./demo
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mock-ai:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./test_plans:/app/test_plans
    environment:
      - TARGET_ENDPOINT=http://mock-ai:8000/agent
    command: python orchestrator/runner.py test_plans/demo_plan.json