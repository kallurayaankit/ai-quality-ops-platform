services:
  mock-ai:
    build:
      context: ./mock_ai_service
      dockerfile: Dockerfile.mock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/agent", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"query\":\"ping\"}"]
      interval: 5s
      timeout: 5s
      retries: 5

  medical-qa:
    build:
      context: ./existing_projects/medical-svc
      dockerfile: Dockerfile.med
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/agent", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"query\":\"ping\"}"]
      interval: 5s
      timeout: 5s
      retries: 5

  research-agent:
    build:
      context: ./existing_projects/research-agent-svc
      dockerfile: Dockerfile.res
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 3

  content-moderation:
    build:
      context: ./existing_projects/content-moderation-svc
      dockerfile: Dockerfile.mod
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/check", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"text\":\"test\"}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fraud-detection:
    build:
      context: ./existing_projects/fraud-detection-svc
      dockerfile: Dockerfile.frd
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/check", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"avg_latency_ms\":200,\"avg_tokens\":3}"]
      interval: 5s
      timeout: 5s
      retries: 5

  locust:
    build:
      context: ./existing_projects/locust-svc
      dockerfile: Dockerfile.loc
    ports:
      - "8005:8000"
    environment:
      - TARGET_ENDPOINT=http://mock-ai:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 3

  model-ab-testing:
    build:
      context: ./existing_projects/model-ab-testing-svc
      dockerfile: Dockerfile.ab
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/compare", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"query\":\"ping\"}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zap:
    build:
      context: ./existing_projects/zap-svc
      dockerfile: Dockerfile.zap
    ports:
      - "8007:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/scan", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"target_url\":\"http://mock-ai:8000\"}"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mock-ai:
        condition: service_healthy
      medical-qa:
        condition: service_healthy
      research-agent:
        condition: service_healthy
      content-moderation:
        condition: service_healthy
      fraud-detection:
        condition: service_healthy
      locust:
        condition: service_healthy
      model-ab-testing:
        condition: service_healthy
      zap:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    environment:
      - TARGET_ENDPOINT=http://mock-ai:8000/agent
      - MEDICAL_ENDPOINT=http://medical-qa:8000/agent
      - RESEARCH_ENDPOINT=http://research-agent:8000/agent
      - MODERATION_ENDPOINT=http://content-moderation:8000/check
      - FRAUD_ENDPOINT=http://fraud-detection:8000/check
      - LOCUST_ENDPOINT=http://locust:8000/run
      - AB_ENDPOINT=http://model-ab-testing:8000/compare
      - ZAP_ENDPOINT=http://zap:8000/scan

  qa-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - mock-ai
    volumes:
      - ./reports:/app/reports
      - ./test_plans:/app/test_plans
    environment:
      - TARGET_ENDPOINT=http://mock-ai:8000/agent
    command: uvicorn qa_service.main:app --host 0.0.0.0 --port 9000